server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    auth_basic "Docs Preview";
    auth_basic_user_file /tmp/.htpasswd;

    location = /health {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
